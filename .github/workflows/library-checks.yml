name: Library regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  library-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dedicated proxy regression checks
        run: pnpm test:library
      - name: Native Workers runtime and unsupported-option mutation
        run: pnpm test:workers
      - name: Target navigation checker regression fixtures
        run: pnpm test:nav-checker
